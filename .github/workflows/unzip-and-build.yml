name: Unzip VEDA VPN and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip VEDA VPN ZIP
        run: |
          set -e
          ZIP="VEDA_VPN_Android_GitHub_Build.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found: $ZIP"
            ls -la
            exit 1
          fi

          mkdir -p /tmp/veda
          unzip -oq "$ZIP" -d /tmp/veda

          SETTINGS=$(find /tmp/veda -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found inside ZIP"
            find /tmp/veda -maxdepth 4 -type f
            exit 1
          fi

          SRC="$(dirname "$SETTINGS")"
          cp -a "$SRC"/. .

          rm -f "$ZIP"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract VEDA VPN Android project"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEDA-VPN-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
