
name: Unzip VEDA VPN and Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="VEDA_VPN_Android_GitHub_Build.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP file not found: $ZIP"
            echo "Upload the ZIP to the repository root."
            ls -la
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/veda"
          unzip -oq "$ZIP" -d "$RUNNER_TEMP/veda"

          SETTINGS="$(find "$RUNNER_TEMP/veda" \
            -type f -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android project not found inside ZIP"
            find "$RUNNER_TEMP/veda" -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEDA-VPN-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
