name: Unzip VEDA VPN and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          mkdir -p /tmp/veda
          unzip -oq VEDA_VPN_Android_Starter.zip -d /tmp/veda
          FILE=$(find /tmp/veda -name settings.gradle.kts -print -quit)
          test -n "$FILE"
          cp -a "$(dirname "$FILE")"/. .
          rm -f VEDA_VPN_Android_Starter.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract VEDA VPN project"
          git push

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEDA-VPN-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
