name: Unzip VEDA VPN and Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="VEDA_VPN_Android_GitHub_Build.zip"
          test -s "$ZIP" || { echo "::error::Missing $ZIP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/veda"
          unzip -oq "$ZIP" -d "$RUNNER_TEMP/veda"
          SETTINGS="$(find "$RUNNER_TEMP/veda" -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS" || { echo '::error::settings.gradle.kts not found in ZIP'; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264"
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          test -x "$NDK/ndk-build" || { echo "::error::ndk-build missing at $NDK"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "$NDK" >> "$GITHUB_PATH"

      - name: Download Xray and build HEV TUN native libraries
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/fetch-natives.sh
          ./scripts/fetch-natives.sh
          test -s app/libs/libv2ray.aar
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            so="app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"
            test -s "$so" || { echo "::error::Missing native library $so"; exit 1; }
            file "$so" | grep -q ELF || { echo "::error::$so is not ELF"; exit 1; }
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug --stacktrace

      - name: Verify native libraries inside APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/**/*.apk app/build/outputs/apk/*/*.apk)
          ((${#apks[@]} > 0)) || { echo '::error::No APK generated'; exit 1; }
          for apk in "${apks[@]}"; do
            echo "Checking $apk"
            unzip -l "$apk" | grep -q 'lib/[^ ]*/libhev-socks5-tunnel.so' || { echo "::error::HEV TUN library missing in $apk"; exit 1; }
            unzip -l "$apk" | grep -Eq 'lib/[^ ]*/libgojni.so|lib/[^ ]*/libv2ray.so' || { echo "::error::Xray JNI library missing in $apk"; exit 1; }
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VEDA-VPN-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload updated project ZIP with native libraries
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/.."
          zip -qr "$GITHUB_WORKSPACE/VEDA_VPN_Android_GitHub_Build_Fixed.zip" "$(basename "$PROJECT_DIR")"
      - name: Upload updated project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VEDA-VPN-fixed-source-ZIP
          path: VEDA_VPN_Android_GitHub_Build_Fixed.zip
          if-no-files-found: error
          retention-days: 14
