name: Unzip VEDA VPN and Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veda-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="VEDA_VPN_Android_GitHub_Build.zip"
          test -f "$ZIP" || { echo "::error::ZIP not found: $ZIP"; ls -la; exit 1; }
          mkdir -p "$RUNNER_TEMP/veda"
          unzip -oq "$ZIP" -d "$RUNNER_TEMP/veda"
          SETTINGS="$(find "$RUNNER_TEMP/veda" -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS" || { echo "::error::settings.gradle.kts not found in ZIP"; find "$RUNNER_TEMP/veda" -maxdepth 4 -type f | head -200; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/scripts/fetch-natives.sh" || { echo "::error::scripts/fetch-natives.sh missing"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018

      - name: Configure NDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_PATH"
          test -x "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/ndk-build"

      - name: Fetch and build Xray + TUN native libraries
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential git patch clang make
          ./scripts/fetch-natives.sh
          test -s app/libs/libv2ray.aar
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -f "app/src/main/jniLibs/$abi/libgojni.so" || { echo "::error::Missing libgojni.so for $abi"; exit 1; }
            test -f "app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so" || { echo "::error::Missing libhev-socks5-tunnel.so for $abi"; exit 1; }
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Unit tests and debug APK build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify native libraries are inside APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*universal*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::Universal debug APK not found"; find app/build/outputs/apk/debug -type f; exit 1; }
          LISTING="$(unzip -l "$APK")"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            for lib in libgojni.so libhev-socks5-tunnel.so; do
              grep -q "lib/$abi/$lib" <<< "$LISTING" || { echo "::error::APK missing $abi/$lib"; exit 1; }
            done
          done
          echo "Native libraries verified in $APK"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: VEDA-VPN-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
